{extend name="admin/layout"}

{block name="content"}
<h1 class="page-title">广告管理</h1>

<section class="panel">
  <h2 class="panel-title">广告位</h2>
  <p class="panel-sub">内容支持 HTML / 图片 / JS。免费运营模式的流量变现入口；VIP 策略组自动免广告。</p>
  {volist name="slots" id="vo"}
  <form class="form form-grid ad-slot-form" data-slot-form="{$vo.id}" style="border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:16px">
    <input type="hidden" name="id" value="{$vo.id}">
    <label class="field"><span class="field-label">{$vo.slot_key} · 名称</span><input type="text" name="name" value="{$vo.name}"></label>
    <label class="field"><span class="field-label">类型</span>
      <select name="type">
        <option value="html" {if condition="$vo.type eq 'html'"}selected{/if}>HTML</option>
        <option value="image" {if condition="$vo.type eq 'image'"}selected{/if}>图片</option>
        <option value="js" {if condition="$vo.type eq 'js'"}selected{/if}>JS</option>
      </select>
    </label>
    <label class="field"><span class="field-label">开关</span>
      <select name="is_open">
        <option value="0" {if condition="$vo.is_open eq 0"}selected{/if}>关闭</option>
        <option value="1" {if condition="$vo.is_open eq 1"}selected{/if}>开启</option>
      </select>
    </label>
    <label class="field field-wide"><span class="field-label">内容</span><textarea name="content" rows="3">{$vo.content}</textarea></label>
    <div class="field" style="justify-content:flex-end"><button type="submit" class="btn">保存</button></div>
  </form>
  {/volist}
</section>
{/block}

{block name="script"}
<script>pageBoot('adminAd');</script>
{/block}
