<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台登录 · {$site_name|default='逍遥图床'}</title>
<link rel="stylesheet" href="/static/imgbed.css">
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<main class="main">
  <div class="auth-card">
    <h1 class="page-title">后台登录</h1>
    {if condition="!empty($error)"}<p class="form-error">{$error}</p>{/if}
    <form method="post" action="/admin/login" class="form">
      <label class="field">
        <span class="field-label">用户名</span>
        <input type="text" name="username" required autofocus placeholder="admin">
      </label>
      <label class="field">
        <span class="field-label">密码</span>
        <input type="password" name="password" required placeholder="登录密码">
      </label>
      <button type="submit" class="btn btn-block">登录后台</button>
    </form>
    <p class="auth-alt"><a href="/">← 回前台</a></p>
  </div>
</main>
</body>
</html>
