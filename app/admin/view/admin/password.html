{extend name="admin/layout"}

{block name="content"}
<h1 class="page-title">修改密码</h1>

<section class="panel" style="max-width:520px">
  <h2 class="panel-title">管理员账号</h2>
  <p class="panel-sub">当前账号：<b>{if condition="$admin"}{$admin.username}{/if}</b>；修改成功后需要重新登录。</p>
  <form class="form form-grid" id="pwdForm">
    <label class="field"><span class="field-label">当前密码</span>
      <input type="password" name="old_password" autocomplete="current-password" required>
    </label>
    <label class="field"><span class="field-label">新密码</span>
      <input type="password" name="new_password" id="pwNew" autocomplete="new-password" minlength="8" required>
      <span class="field-hint">至少 8 位，建议含字母和数字</span>
    </label>
    <label class="field"><span class="field-label">确认新密码</span>
      <input type="password" name="confirm_password" id="pwConfirm" autocomplete="new-password" minlength="8" required>
    </label>
    <div style="padding:14px 0 2px">
      <button type="submit" class="btn">保存新密码</button>
    </div>
  </form>
</section>
{/block}

{block name="script"}
<script>
document.getElementById('pwdForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var f = e.target;
  var fd = new FormData(f);
  if (fd.get('new_password') !== fd.get('confirm_password')) {
    toast('两次输入的新密码不一致');
    return;
  }
  fetch('/admin/password', { method: 'POST', body: fd })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      toast(d.message);
      if (d.status) { setTimeout(function () { location.href = '/admin/login'; }, 1200); }
    })
    .catch(function () { toast('网络错误'); });
});
</script>
{/block}
