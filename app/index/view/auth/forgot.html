{extend name="common/layout"}

{block name="content"}
<section class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title">找回密码</h1>
    {if condition="isset($sent) && $sent"}
    <p class="auth-sub">如果该邮箱已注册，重置邮件已发送（含垃圾箱检查）。</p>
    <p style="margin-top:16px"><a class="btn-ghost-sm" href="/login">返回登录</a></p>
    {else /}
    <form method="post" action="/forgot" class="auth-form">
      <label>注册邮箱</label>
      <input type="email" name="email" value="{$email|default=''}" required>
      {if condition="isset($error)"}<p class="form-error">{$error}</p>{/if}
      <button type="submit" class="btn btn-block">发送重置邮件</button>
    </form>
    <p class="auth-sub" style="margin-top:14px"><a href="/login">返回登录</a></p>
    {/if}
  </div>
</section>
{/block}
