{extend name="common/layout"}

{block name="content"}
<section class="auth-wrap">
  <div class="auth-card" style="text-align:center">
    <h1 class="auth-title">{if condition="$ok"}✅ 成功{else /}⚠️ 失败{/if}</h1>
    <p class="auth-sub">{$msg}</p>
    <p style="margin-top:18px">
      {if condition="$ok"}
      <a class="btn" href="/console">进入个人中心</a>
      {else /}
      <a class="btn-ghost-sm" href="/login">去登录</a>
      <a class="btn-ghost-sm" href="/forgot">重新申请</a>
      {/if}
    </p>
  </div>
</section>
{/block}
