services:
  app:
    build: .
    container_name: imgbed-app
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./runtime:/var/www/html/runtime
      - ./public/storage/images:/var/www/html/public/storage/images
    depends_on:
      - db
    networks: [imgbed]

  nginx:
    image: nginx:1.27-alpine
    container_name: imgbed-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - app
    networks: [imgbed]

  db:
    image: mysql:8.0
    container_name: imgbed-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: change-me-root
      MYSQL_DATABASE: imgbed
      MYSQL_USER: imgbed
      MYSQL_PASSWORD: change-me-dbpass
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - db-data:/var/lib/mysql
      - ./install.sql:/docker-entrypoint-initdb.d/install.sql:ro
    networks: [imgbed]

volumes:
  db-data:

networks:
  imgbed:
